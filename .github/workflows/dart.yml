name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Complete Android scaffolding
        run: |
          flutter create . --platforms=android --org com.misrmobasher --project-name installment_app
          rm -f test/widget_test.dart
          rm -rf android/app/src/main/kotlin/com/misrmobasher/installment_app

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Test
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: installment_app_apk
          path: build/app/outputs/flutter-apk/app-release.apk
